<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desculpa</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #090014;
      font-family: Arial, Helvetica, sans-serif;
      animation: fundo 5s infinite;
    }
    h1 {
      margin: 0;
      padding: 24px;
      text-align: center;
      font-size: clamp(3.5rem, 15vw, 11rem);
      font-weight: 900;
      letter-spacing: .06em;
      color: #fff;
      animation: piscar .8s steps(1, end) infinite, cores 4s linear infinite;
      text-shadow: 0 0 12px currentColor, 0 0 35px currentColor;
    }
    @keyframes piscar {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: .12; }
    }
    @keyframes cores {
      0% { color: #ff1744; }
      25% { color: #ffea00; }
      50% { color: #00e5ff; }
      75% { color: #d500f9; }
      100% { color: #ff1744; }
    }
    @keyframes fundo {
      0%, 100% { background: #090014; }
      33% { background: #160018; }
      66% { background: #00131b; }
    }
  </style>
</head>
<body>
  <h1>DESCULPA</h1>
</body>
</html>
